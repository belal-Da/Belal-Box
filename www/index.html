<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Belal Box</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0f0a1f;--cd:#1b1438;--fg:#f4f0ff;--mu:#a398cc;--a1:#ff7a45;--a2:#8b5cf6;--a3:#22d3ee;--bd:#322766}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg) center/cover fixed;color:var(--fg);font:15px/1.6 system-ui,sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);max-width:860px;margin:auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.lg{width:30px;height:30px;border-radius:9px;object-fit:cover}
header b,.gr{background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;color:transparent;font-size:18px}
header span{flex:1;font-size:11px;color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
button{font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;cursor:pointer}
.pri{background:linear-gradient(90deg,var(--a1),var(--a2));border:0;font-weight:600;width:100%;margin-top:14px;padding:10px}
#chat{flex:1;overflow-y:auto;padding:14px}
.u{margin:12px 0 12px auto;max-width:85%;width:fit-content;background:linear-gradient(135deg,#6d3fe0,#c2410c);padding:9px 13px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;word-break:break-word}
.u img{max-width:120px;border-radius:10px;margin:0 4px 6px 0}
.ch{display:inline-block;background:#0005;border-radius:8px;padding:1px 8px;margin:0 4px 4px 0;font-size:12px}
.a{margin:12px 0;word-break:break-word}.a p,.a ul,.a ol{margin:8px 0}.a ul,.a ol{padding-left:22px}.a h2,.a h3,.a h4,.a h5{margin:14px 0 6px}
.a code{background:#ffffff18;padding:1px 5px;border-radius:5px;font-size:13px}.a a{color:var(--a3)}
.fc{background:#0c0820;border:1px solid var(--bd);border-radius:12px;margin:10px 0;overflow:hidden}
.fh{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 10px;background:var(--cd);font-size:13px;flex-wrap:wrap}
.fh button{padding:3px 8px;font-size:12px;margin-left:4px}
.fc pre{padding:10px;overflow:auto;max-height:340px;font:12.5px/1.5 ui-monospace,monospace;color:#d9ceff}
.ac{display:flex;gap:6px}.ac button{padding:2px 8px;font-size:13px;background:none;border-color:transparent}
footer{padding:8px 10px 10px}#atts{padding:0 4px}
.bar{display:flex;gap:8px;align-items:flex-end;background:var(--cd);border:1px solid var(--bd);border-radius:24px;padding:6px}
.bar textarea{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;resize:none;max-height:160px;padding:7px 4px}
.bar label,.bar button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:18px;cursor:pointer}
#send{background:linear-gradient(135deg,var(--a1),var(--a2));border:0}
.wl{text-align:center;margin-top:9vh}.wl p{color:var(--mu);margin:6px 0 16px}.sg{display:block;margin:8px auto;max-width:320px;width:100%}
.ov{position:fixed;inset:0;background:#000a;display:none;z-index:9}.ov.on{display:flex}
#side{justify-content:flex-start}#sp{width:78%;max-width:320px;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 12px 12px;overflow-y:auto}
.ci{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:10px;cursor:pointer}.ci.cur{background:var(--cd)}.ci span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.ci button{background:none;border:0}
#set{align-items:flex-end}#setb{background:var(--bg);width:100%;max-height:92dvh;overflow-y:auto;padding:16px;border-radius:20px 20px 0 0;max-width:860px;margin:auto}
#setb label{display:block;margin:12px 0 4px;color:var(--mu);font-size:13px}#setb input:not([type=checkbox]),#setb select,#setb textarea{width:100%;padding:9px;margin-top:4px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;color:var(--fg);font:inherit}
#setb .row{display:flex;gap:8px;margin-top:8px}
#pv{flex-direction:column;background:#fff}#pv button{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:2}#pvf{flex:1;border:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:12px;display:none;z-index:20;max-width:90%}#toast.on{display:block}
</style></head><body>
<div id="app"><header><button id="menu">☰</button><img class="lg" src="https://i.imgur.com/nR5XLig.jpeg" onerror="this.style.display='none'"><b>Belal Box</b><span id="mdl"></span><button id="gear">⚙️</button></header>
<div id="chat"></div>
<footer><div id="atts"></div><div class="bar"><label>＋<input type="file" id="file" multiple hidden></label><textarea id="inp" rows="1" placeholder="Belal Box-কে লিখুন…"></textarea><button id="send">➤</button></div></footer></div>
<div id="side" class="ov"><div id="sp"><button class="pri" id="nc" style="margin:0 0 10px">➕ নতুন চ্যাট</button><div id="cl"></div></div></div>
<div id="set" class="ov"><div id="setb"></div></div>
<div id="pv" class="ov"><button id="pvx">✕ বন্ধ</button><iframe id="pvf" sandbox="allow-scripts"></iframe></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),J=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch(e){return d}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const DEF="You are Belal Box, a powerful AI assistant and coding agent. Reply in the user's language (Bengali if they write Bengali). Be direct and helpful. Whenever you create or modify a file, put the COMPLETE file in its own fenced code block whose info string is the language followed by the file name, e.g. ```html index.html. One block per file, never truncate, never use placeholders like '...rest of code'. Keep explanations short and outside the code blocks.";
const TXT=/\.(txt|md|json|js|mjs|ts|jsx|tsx|html|css|py|java|kt|xml|yml|yaml|sh|bat|c|cpp|h|go|rs|php|rb|sql|csv|ini|toml|gradle|properties|cfg|svg)$/i;
let cfg=J('bb_cfg',null)||{active:0,max:16000,stream:true,sys:'',wall:'',tts:{url:'https://api.murf.ai/v1/speech/generate',key:'',voice:''},provs:[{name:'OpenRouter',type:'openai',base:'https://openrouter.ai/api/v1',key:'',model:'anthropic/claude-sonnet-4.5',models:[]},{name:'Anthropic',type:'anthropic',base:'https://api.anthropic.com',key:'',model:'claude-sonnet-5-5',models:[]},{name:'OpenAI',type:'openai',base:'https://api.openai.com/v1',key:'',model:'gpt-4o',models:[]}]};
let chats=J('bb_chats',[]),ci=0,pend=[],busy=false,ab=null,audio=null,F={},q=0;
const cur=()=>chats[ci];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)};
const save=()=>{try{localStorage.bb_cfg=JSON.stringify(cfg);localStorage.bb_chats=JSON.stringify(chats)}catch(e){toast('স্টোরেজ ভরে গেছে, পুরনো চ্যাট মুছুন')}};
const newChat=()=>{chats.unshift({id:Date.now(),title:'নতুন চ্যাট',msgs:[]});ci=0};
const go=()=>{const e=$('#chat');e.scrollTop=e.scrollHeight};
const wall=()=>{document.body.style.backgroundImage=cfg.wall?`linear-gradient(#0f0a1fb8,#0f0a1fb8),url(${cfg.wall})`:'';save()};
const shrink=(f,m,ql)=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',ql))};i.src=URL.createObjectURL(f)});
const isN=()=>{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()};
async function hx(url,h,body){if(isN()){const r=await Capacitor.Plugins.CapacitorHttp.request({url,method:body?'POST':'GET',headers:h,data:body});if(r.status>=400)throw new Error(r.status+' '+JSON.stringify(r.data).slice(0,200));return r.data}
const r=await fetch(url,{method:body?'POST':'GET',headers:h,body:body&&JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status+' '+JSON.stringify(j).slice(0,200));return j}
/* markdown + file cards */
function md(t,mi){let out='',n=0,last=0,m;const re=/```([^\n]*)\n([\s\S]*?)(```|$)/g;
const inl=s=>esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>');
const blk=s=>s.split(/\n\s*\n/).map(p=>{p=p.trim();if(!p)return'';const h=p.match(/^(#{1,4})\s+(.*)/);if(h&&!p.includes('\n')){const L=h[1].length+1;return`<h${L}>${inl(h[2])}</h${L}>`}
if(/^([-*]|\d+\.)\s/.test(p)){const o=/^\d/.test(p)?'ol':'ul';return`<${o}>`+p.split('\n').map(l=>`<li>${inl(l.replace(/^([-*]|\d+\.)\s+/,''))}</li>`).join('')+`</${o}>`}
return'<p>'+inl(p).replace(/\n/g,'<br>')+'</p>'}).join('');
const EX={javascript:'js',python:'py',typescript:'ts',bash:'sh',shell:'sh',text:'txt',markdown:'md'};
while((m=re.exec(t))){out+=blk(t.slice(last,m.index));const inf=m[1].trim().split(/\s+/),lg=inf[0]||'text',k=mi+':'+(n++);
F[k]={n:inf[1]||('file-'+n+'.'+(EX[lg]||lg)),c:m[2].replace(/\n$/,'')};
const pv=(lg=='html'||lg=='svg')&&m[3]?`<button data-a="pv" data-k="${k}">👁️ প্রিভিউ</button>`:'';
out+=`<div class="fc"><div class="fh"><span>📄 ${esc(F[k].n)}</span><span>${pv}<button data-a="cp" data-k="${k}">কপি</button><button data-a="dl" data-k="${k}">⬇️ ডাউনলোড</button></span></div><pre>${esc(F[k].c)}</pre></div>`;last=re.lastIndex;if(!m[3])break}
return out+blk(t.slice(last))}
const nf=i=>Object.keys(F).filter(k=>k.startsWith(i+':')).length;
function mh(m,i){if(m.r=='user'){const im=m.imgs||[],nm=m.names||[];return`<div class="u">${im.map(d=>`<img src="${d}">`).join('')}${nm.map(x=>`<span class="ch">📎 ${esc(x)}</span>`).join('')}${im.length||nm.length?'<br>':''}${esc(m.show||'')}</div>`}
const b=md(m.t,i);return`<div class="a" id="m${i}"><div class="ab">${b}</div><div class="ac"><button data-a="sp" data-i="${i}">🔊</button><button data-a="cm" data-i="${i}">📋</button>${nf(i)>1?`<button data-a="zp" data-i="${i}">📦 ZIP</button>`:''}</div></div>`}
const WEL=`<div class="wl"><img class="lg" style="width:64px;height:64px;border-radius:18px" src="https://i.imgur.com/nR5XLig.jpeg" onerror="this.style.display='none'"><h2>আমি <span class="gr">Belal Box</span></h2><p>কোড, ফাইল, ছবি, zip — সব নিয়ে কাজ করি।</p><button class="sg">একটা সুন্দর ল্যান্ডিং পেজ বানাও (index.html)</button><button class="sg">Python দিয়ে একটা টুডু অ্যাপ লেখো</button><button class="sg">এই প্রজেক্টটা বিশ্লেষণ করো</button></div>`;
function rend(){const c=cur(),p=cfg.provs[cfg.active];F={};$('#chat').innerHTML=c.msgs.length?c.msgs.map(mh).join(''):WEL;$('#mdl').textContent=p.name+' · '+p.model;go()}
const up=i=>{const e=$('#m'+i+' .ab');if(e){e.innerHTML=md(cur().msgs[i].t,i);go()}};
const tick=i=>{if(!q)q=requestAnimationFrame(()=>{q=0;up(i)})};
/* API */
async function call(c,p,sg,tok){const an=p.type=='anthropic';let b=p.base.replace(/\/+$/,'');if(an)b=b.replace(/\/v1$/,'');
const uc=m=>{const im=m.imgs||[];if(!im.length)return m.t;const tx={type:'text',text:m.t};return an?[...im.map(d=>({type:'image',source:{type:'base64',media_type:d.slice(5,d.indexOf(';')),data:d.split(',')[1]}})),tx]:[tx,...im.map(d=>({type:'image_url',image_url:{url:d}}))]};
const h=c.msgs.filter(m=>m.t&&!m.err).map(m=>m.r=='user'?{role:'user',content:uc(m)}:{role:'assistant',content:m.t}),sys=cfg.sys||DEF;
const url=an?b+'/v1/messages':b+'/chat/completions';
const hd=an?{'x-api-key':p.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'}:{Authorization:'Bearer '+p.key,'content-type':'application/json'};
const body=an?{model:p.model,max_tokens:+cfg.max||16000,system:sys,messages:h,stream:cfg.stream}:{model:p.model,max_tokens:+cfg.max||16000,messages:[{role:'system',content:sys},...h],stream:cfg.stream};
if(!cfg.stream){const j=await hx(url,hd,body);tok(an?j.content.map(x=>x.text||'').join(''):j.choices[0].message.content);return}
const r=await fetch(url,{method:'POST',headers:hd,body:JSON.stringify(body),signal:sg});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,300));
const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(!d||d=='[DONE]')continue;try{const j=JSON.parse(d),x=an?(j.delta&&j.delta.text):(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content);if(x)tok(x)}catch(e){}}}}
async function send(){if(busy){ab&&ab.abort();return}
const t=$('#inp').value.trim();if(!t&&!pend.length)return;const p=cfg.provs[cfg.active];
if(!p.key||!p.model||!p.base){toast('আগে সেটিংসে API Key, Base URL ও মডেল দিন');openSet();return}
const c=cur();let full=t;const imgs=[],names=pend.map(f=>f.name);
pend.forEach(f=>f.img?imgs.push(f.img):full+=`\n\n<attachment name="${f.name}">\n${f.txt}\n</attachment>`);
c.msgs.push({r:'user',t:full||'ছবিটি দেখো',show:t,imgs,names});if(c.msgs.length==1)c.title=(t||names[0]).slice(0,32);
c.msgs.push({r:'assistant',t:''});pend=[];chips();$('#inp').value='';$('#inp').style.height='auto';
rend();const i=c.msgs.length-1;busy=true;$('#send').textContent='⏹';ab=new AbortController();
try{await call(c,p,ab.signal,x=>{c.msgs[i].t+=x;tick(i)})}catch(e){if(e.name!='AbortError'){c.msgs[i].t+=(c.msgs[i].t?'\n\n':'')+'⚠️ ত্রুটি: '+e.message;c.msgs[i].err=1}}
if(!c.msgs[i].t)c.msgs.pop();busy=false;$('#send').textContent='➤';save();rend()}
/* download / zip / tts */
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
async function dl(name,blob){if(isN()){try{const{Filesystem,Share}=Capacitor.Plugins;await Filesystem.writeFile({path:name,data:await b64(blob),directory:'CACHE'});const u=await Filesystem.getUri({path:name,directory:'CACHE'});await Share.share({title:name,url:u.uri,dialogTitle:'সেভ / শেয়ার করুন'});return}catch(e){toast('ডাউনলোড ব্যর্থ: '+e.message)}}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)}
function zipAll(i){const z=new JSZip();Object.entries(F).filter(([k])=>k.startsWith(i+':')).forEach(([k,f])=>z.file(f.n.replace(/^\/+/,''),f.c));z.generateAsync({type:'blob'}).then(b=>dl('belal-box-files.zip',b))}
async function speak(i){let t=cur().msgs[i].t.replace(/```[\s\S]*?(```|$)/g,' ').replace(/[*#`_>\[\]]/g,'').trim().slice(0,2800);if(!t)return;
if(audio){audio.pause();audio=null}speechSynthesis.cancel();const T=cfg.tts;
if(T.key&&T.voice&&T.url){toast('🔊 লোড হচ্ছে…');try{const j=await hx(T.url,{'api-key':T.key,'content-type':'application/json'},{text:t,voiceId:T.voice});const u=j.audioFile||j.audio_url||j.url;if(!u)throw new Error(JSON.stringify(j).slice(0,150));audio=new Audio(u);audio.play();return}catch(e){toast('ভয়েস API ত্রুটি: '+e.message)}}
const u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';speechSynthesis.speak(u)}
/* attachments */
async function unzip(f){const z=await JSZip.loadAsync(f),tr=[];let body='',tot=0;for(const[n,e]of Object.entries(z.files)){if(e.dir)continue;tr.push(n);if(TXT.test(n)&&tot<4e5){const s=await e.async('string');if(s.length<6e4){body+=`\n<file name="${n}">\n${s}\n</file>`;tot+=s.length}}}
return'ফাইল তালিকা ('+tr.length+'):\n'+tr.slice(0,400).join('\n')+'\n'+body}
const chips=()=>{$('#atts').innerHTML=pend.map((f,i)=>`<span class="ch">${f.img?'🖼️':'📎'} ${esc(f.name)} <b data-r="${i}">✕</b></span>`).join('')};
$('#file').onchange=async e=>{for(const f of e.target.files){try{if(f.type.startsWith('image/'))pend.push({name:f.name,img:await shrink(f,1280,.8)});
else if(/\.(zip|apk|jar|aar)$/i.test(f.name))pend.push({name:f.name,txt:await unzip(f)});
else pend.push({name:f.name,txt:TXT.test(f.name)||f.type.startsWith('text/')?(await f.text()).slice(0,2e5):'(বাইনারি ফাইল, '+f.size+' bytes)'})}catch(x){toast(f.name+': '+x.message)}}e.target.value='';chips()};
$('#atts').onclick=e=>{const r=e.target.dataset.r;if(r!=null){pend.splice(+r,1);chips()}};
/* settings */
function openSet(){const p=cfg.provs[cfg.active],T=cfg.tts,o=(v,l)=>`<option value="${v}" ${p.type==v?'selected':''}>${l}</option>`;
$('#setb').innerHTML=`<label>প্রোভাইডার</label><select id="s_p">${cfg.provs.map((x,i)=>`<option value="${i}" ${i==cfg.active?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
<div class="row"><button id="s_add">＋ নতুন</button><button id="s_del">🗑️ মুছুন</button></div>
<label>নাম</label><input id="s_n" value="${esc(p.name)}"><label>ধরন</label><select id="s_t">${o('openai','OpenAI-compatible (OpenRouter, কাস্টম…)')}${o('anthropic','Anthropic (Claude)')}</select>
<label>Base URL</label><input id="s_b" value="${esc(p.base)}"><label>API Key</label><input id="s_k" type="password" value="${esc(p.key)}">
<label>মডেল</label><input id="s_m" value="${esc(p.model)}">${p.models.length?`<select id="s_ml"><option value="">— ${p.models.length}টি মডেল থেকে বেছে নিন —</option>${p.models.map(m=>`<option>${esc(m)}</option>`).join('')}</select>`:''}
<div class="row"><button id="s_f">🔄 Fetch Models</button></div>
<label>Max tokens (বড় ফাইলের জন্য বাড়ান)</label><input id="s_x" type="number" value="${cfg.max}">
<label><input type="checkbox" id="s_st" ${cfg.stream?'checked':''}> লাইভ স্ট্রিমিং</label>
<label>System prompt (ফাঁকা = ডিফল্ট)</label><textarea id="s_s" rows="3">${esc(cfg.sys)}</textarea>
<label>🔊 ভয়েস API (Murf ইত্যাদি)</label><input id="s_tu" placeholder="TTS URL" value="${esc(T.url||'')}"><input id="s_tk" type="password" placeholder="Voice API Key" value="${esc(T.key||'')}"><input id="s_tv" placeholder="Voice ID / Character ID" value="${esc(T.voice||'')}">
<label>🖼️ ওয়ালপেপার</label><input type="file" id="s_w" accept="image/*"><div class="row"><button id="s_wc">ওয়ালপেপার সরান</button></div>

$('#s_p').onchange=e=>{rf();cfg.active=+e.target.value;openSet()};
